version: '3.8'
services:
  frontend:
    build: ./frontend
    ports: ['3000:80']
    depends_on: [backend]

  backend:
    build: ./backend
    ports: ['8000:8000']
    volumes:
      - ./uploads:/app/uploads
    environment:
      - DB_HOST=oracle-db
      - DB_PORT=1521
      - SECRET_KEY=onboard_secret_key_2024_wipro

  ai-service:
    build: ./ai-service
    ports: ['5000:5000']
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_HOST=oracle-db
