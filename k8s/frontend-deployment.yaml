apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboard-frontend
  labels:
    app: onboard-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onboard-frontend
  template:
    metadata:
      labels:
        app: onboard-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: onboard-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
