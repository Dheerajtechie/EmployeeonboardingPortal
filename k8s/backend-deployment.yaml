apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboard-backend
  labels:
    app: onboard-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: onboard-backend
  template:
    metadata:
      labels:
        app: onboard-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: onboard-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ORACLE_USER
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: username
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: password
            - name: ORACLE_DSN
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: oracle-dsn
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: secret-key
            - name: CORS_ORIGINS
              value: "*"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          emptyDir: {}
